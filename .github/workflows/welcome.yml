name: "Welcome New Contributors"

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Welcome to the Um:bruch community! Thank you for opening your first issue.
            Our team and community members will review it soon.
          pr-message: >
            Thank you for your first pull request to Um:bruch!
            We appreciate your contribution to open research and civic software.
